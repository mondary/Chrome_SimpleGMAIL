<html lang="fr">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="title">
      <span class="dot"></span>
      PK Simple Gmail
    </div>
    <div class="sub">Thèmes &amp; tweaks pour Gmail</div>
  </header>

  <section id="themes"></section>

  <main>
    <div class="list-tools">
      <div class="list-title">Scripts <span id="count">—</span></div>
      <div class="actions">
        <button id="all-on" title="Activer tous les tweaks">Tout activer</button>
        <button id="all-off" title="Désactiver tous les tweaks">Tout désactiver</button>
      </div>
    </div>
    <div id="list"></div>
  </main>

  <footer>
    <span class="hint">Gmail est rechargé après chaque changement · pense à désactiver les équivalents ScriptCat</span>
    <a class="kofi" href="https://ko-fi.com/pouark" target="_blank" rel="noopener noreferrer">Soutenir sur Ko-fi ↗</a>
  </footer>

  <script src="data/manifest.js"></script>
  <script src="data/themes.js"></script>
  <script src="popup.js"></script>
</body>
</html>
